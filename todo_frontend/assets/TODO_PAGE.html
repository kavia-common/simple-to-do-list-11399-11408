<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TODO PAGE</title>
  <link rel="stylesheet" href="./common.css" />
  <link rel="stylesheet" href="./TODO_PAGE.css" />
</head>
<body data-screen="TODO_PAGE">
  <div class="screen" aria-label="TODO PAGE">

    <!-- Status Bar (placeholder) -->
    <div class="status-bar" aria-hidden="true"></div>

    <!-- App Bar -->
    <header class="app-bar" role="banner">
      <h1 class="title-large">TODO APP</h1>
      <button class="calendar-button" aria-label="Calendar">
        <!-- Calendar icon (32x32) -->
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect x="4" y="6" width="24" height="22" rx="2" fill="#FFFFFF" fill-opacity="0" stroke="#FFFFFF" stroke-width="2"/>
          <line x1="4" y1="11" x2="28" y2="11" stroke="#FFFFFF" stroke-width="2"/>
          <line x1="10" y1="2" x2="10" y2="8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
          <line x1="22" y1="2" x2="22" y2="8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <!-- Todo List (generated via JS to match Figma cards: 400x82 with shadow) -->
    <main class="todo-list" role="main" aria-label="Todo items">
      <!-- Cards inserted by app.js render -->
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" role="navigation" aria-label="Todo Filters">
      <button class="nav-item selected" data-filter="all" aria-pressed="true">
        <!-- Playlist icon (approximate) -->
        <svg viewBox="0 0 30 30" aria-hidden="true">
          <g transform="translate(6,9)">
            <line x1="0" y1="1" x2="18" y2="1" stroke="var(--color-9395d3)" stroke-width="1.5" stroke-linecap="round" />
            <circle cx="0" cy="1" r="1.5" fill="var(--color-d1d1d6)"/>
            <line x1="0" y1="7" x2="18" y2="7" stroke="var(--color-9395d3)" stroke-width="1.5" stroke-linecap="round" />
            <circle cx="0" cy="7" r="1.5" fill="var(--color-d1d1d6)"/>
            <line x1="0" y1="13" x2="18" y2="13" stroke="var(--color-9395d3)" stroke-width="1.5" stroke-linecap="round" />
            <circle cx="0" cy="13" r="1.5" fill="var(--color-d1d1d6)"/>
          </g>
        </svg>
        <span class="label">All</span>
      </button>

      <button class="nav-item" data-filter="completed" aria-pressed="false">
        <!-- Tick icon -->
        <svg viewBox="0 0 30 30" aria-hidden="true">
          <g transform="translate(6,7)">
            <path d="M1 7.5 L6 12 L17 1" class="icon-stroke" />
          </g>
        </svg>
        <span class="label">Completed</span>
      </button>
    </nav>

    <!-- Floating Action Button (Add New ToDo) -->
    <button class="fab" id="fab-add" aria-label="Add new todo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <line x1="12" y1="4" x2="12" y2="20" class="plus-stroke"/>
        <line x1="4" y1="12" x2="20" y2="12" class="plus-stroke"/>
      </svg>
    </button>

  </div>
  <script src="./app.js"></script>
</body>
</html>
